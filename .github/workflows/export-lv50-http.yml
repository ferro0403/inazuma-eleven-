name: Scratch HTTP Export Zukan Lv50
on:
  push:
    branches: [tmp/zukan-attributes-only-20261118]
    paths:
      - scripts/export_lv50_http.py
      - .github/workflows/export-lv50-http.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4==4.14.2'
      - name: Read only the official Zukan HTML and produce verified ID map
        run: python scripts/export_lv50_http.py
      - name: Copy previously verified complete catalogs as data inputs only
        run: |
          set -euo pipefail
          mkdir -p export/data
          BASE=https://raw.githubusercontent.com/ferro0403/inazuma-eleven-/e6f5b4c1552258012abae850ba2449073dc8007e/data
          curl -fL --retry 3 --connect-timeout 15 "$BASE/players.js" -o export/data/players.js
          curl -fL --retry 3 --connect-timeout 15 "$BASE/teams.js" -o export/data/teams.js
          test -s export/data/players.js
          test -s export/data/teams.js
      - name: Downloadable extraction, no commits to app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-lv50-http-export
          path: export/
          if-no-files-found: warn
          retention-days: 7
