name: Scratch Zukan Lv50 attribute probe
on:
  push:
    branches: [tmp/zukan-attributes-only-20261118]
    paths: [scripts/probe_lv50_stats.py, .github/workflows/probe-lv50-stats.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
      - name: Read HTML, no write to application
        run: python scripts/probe_lv50_stats.py
