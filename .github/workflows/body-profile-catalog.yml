name: Probe exact CHARA_BASE model links

on:
  push:
    branches: [feature/player-body-profiles-exact]
    paths: [.github/workflows/body-profile-catalog.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public NIE chara_base from DNS and direct origin
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, ssl, urllib.request, urllib.error
          from pathlib import Path

          codes = ["c07110020","c07050010","c03031470","c01000915"]
          urls = [
            "https://api.aphrody.com/api/v1/donnees/famille/chara_base",
            "https://nie.aphrody.com/api/v1/donnees/famille/chara_base",
            "https://api.aphrody.com/api/v1/formats/decode/data/common/gamedata/character/chara_base_1.03.98.00.cfg.bin",
            "https://nie.aphrody.com/api/v1/formats/decode/data/common/gamedata/character/chara_base_1.03.98.00.cfg.bin",
          ]

          def fetch(url):
              req=urllib.request.Request(url,headers={"User-Agent":"inazuma-body-profile-catalog/1.0","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      return r.status,r.read()
              except urllib.error.HTTPError as e:
                  return e.code,e.read()
              except Exception as e:
                  return None,repr(e).encode()

          results=[]
          for url in urls:
              status,raw=fetch(url)
              print("HTTP",status,url,"bytes",len(raw),"head",raw[:160])
              rec={"url":url,"status":status,"bytes":len(raw),"matches":{}}
              if status==200:
                  text=raw.decode("utf-8","replace")
                  for code in codes:
                      pos=text.lower().find(code)
                      if pos>=0:
                          rec["matches"][code]=text[max(0,pos-500):pos+1200]
                          print("FOUND",code,url,"context",rec["matches"][code])
              results.append(rec)

          # Direct public origin disclosed by upstream's own bootstrap docs.
          import subprocess
          direct_urls = [
            "https://api.aphrody.com/api/v1/donnees/famille/chara_base",
            "https://api.aphrody.com/api/v1/formats/decode/data/common/gamedata/character/chara_base_1.03.98.00.cfg.bin",
          ]
          for n,url in enumerate(direct_urls):
              out=Path(f"/tmp/direct{n}.json")
              cmd=["curl","-sS","-L","--max-time","60","--resolve","api.aphrody.com:443:51.77.147.152",
                   "-A","inazuma-body-profile-catalog/1.0","-w","%{http_code}",url,"-o",str(out)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              status=p.stdout[-3:] if p.returncode==0 else f"curl:{p.returncode}"
              raw=out.read_bytes() if out.exists() else p.stderr.encode()
              print("DIRECT",status,url,"bytes",len(raw),"head",raw[:160])
              rec={"url":url+"#direct-origin","status":status,"bytes":len(raw),"matches":{}}
              if status=="200":
                  text=raw.decode("utf-8","replace")
                  for code in codes:
                      pos=text.lower().find(code)
                      if pos>=0:
                          rec["matches"][code]=text[max(0,pos-500):pos+1200]
                          print("DIRECT_FOUND",code,"context",rec["matches"][code])
              results.append(rec)

          Path("data/chara_base_origin_probe.json").write_text(json.dumps(results,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: chara-base-origin-probe
          path: data/chara_base_origin_probe.json
