name: Probe NIE model reports for exact body aliases

on:
  push:
    branches: [feature/player-body-profiles-exact]
    paths: [.github/workflows/body-profile-catalog.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read exact assembly reports
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, re, urllib.error, urllib.request
          from pathlib import Path

          old_url = "https://raw.githubusercontent.com/ferro0403/inazuma-eleven-/85d116e6dfcaa2995b596e212a2ce3b7a1f1b11f/.github/workflows/body-profile-catalog.yml"
          with urllib.request.urlopen(old_url, timeout=60) as r:
              old = r.read().decode("utf-8")
          m = re.search(r"^\s*codes\s*=\s*(\[[^\n]+\])", old, re.M)
          codes = ast.literal_eval(m.group(1))
          assert len(codes) == 87

          bases = [
              "https://cdn.aphrody.com/model-report/{code}.json",
              "https://cdn.rosegriffon.fr/model-report/{code}.json",
          ]
          results={}
          for code in codes:
              attempts=[]
              report=None
              for tmpl in bases:
                  url=tmpl.format(code=code)
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"inazuma-body-profile-audit/1.0"})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          raw=r.read()
                          status=r.status
                      obj=json.loads(raw)
                      attempts.append({"url":url,"status":status})
                      report=obj
                      break
                  except Exception as exc:
                      attempts.append({"url":url,"error":repr(exc)})
              item={"attempts":attempts,"report":report}
              results[code]=item
              if isinstance(report,dict):
                  cat=report.get("catalogues") or {}
                  print("REPORT",code,
                        "body_type_idx=",report.get("body_type_idx"),
                        "chara_model_row=",cat.get("chara_model_row"),
                        "body_row=",cat.get("body_row"),
                        "body_objbin=",cat.get("body_objbin"),
                        "notes=",json.dumps(report.get("notes"),ensure_ascii=False))
              else:
                  print("NO_REPORT",code,json.dumps(attempts))
          usable_nonzero=[
              code for code,item in results.items()
              if isinstance(item["report"],dict)
              and isinstance(item["report"].get("body_type_idx"),int)
              and item["report"]["body_type_idx"] != 0
          ]
          direct=[
              code for code,item in results.items()
              if isinstance(item["report"],dict)
              and (item["report"].get("catalogues") or {}).get("body_row") is not None
          ]
          print("SUMMARY reports=",sum(isinstance(v["report"],dict) for v in results.values()),
                "direct_body_rows=",len(direct),
                "safe_nonzero_manifest=",len(usable_nonzero))
          Path("data/nie_model_reports_body_aliases.json").write_text(
              json.dumps({
                  "version":1,
                  "sources":bases,
                  "safeRule":"Accept body_type_idx when body_row is present, or nonzero value when body_row is absent because server fallback is exactly 0.",
                  "results":results,
              },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nie-model-reports-body-aliases
          if-no-files-found: error
          path: data/nie_model_reports_body_aliases.json
