name: Inspect NIE packaged body/model indexes

on:
  push:
    branches: [feature/player-body-profiles-exact]
    paths: [.github/workflows/body-profile-catalog.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NIE v0.5.9 package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq msitools unzip
          curl -L --fail --retry 3 -o /tmp/niers.msi \
            https://github.com/aphrody-code/nie/releases/download/v0.5.9/niers_0.5.9_x64_en-US.msi
          mkdir -p /tmp/niers-msi
          msiextract -C /tmp/niers-msi /tmp/niers.msi >/dev/null
          echo "=== RELEVANT MSI FILES ==="
          find /tmp/niers-msi -type f | sed 's#^/tmp/niers-msi/##' | grep -Ei '(body|model|chara|manifest|mirror|sqlite|lookup|catalog)' | sort | head -500 || true
          echo "=== ALL JSON/NDJSON/DB/GZ ==="
          find /tmp/niers-msi -type f | sed 's#^/tmp/niers-msi/##' | grep -Ei '\.(json|ndjson|sqlite|db|gz)$' | sort | head -1000 || true
          echo "=== PLUGIN ZIP ==="
          curl -L --fail --retry 3 -o /tmp/niers.zip \
            https://github.com/aphrody-code/nie/releases/download/v0.5.9/niers-1.1.0.zip
          unzip -l /tmp/niers.zip | grep -Ei '(body|model|chara|manifest|mirror|sqlite|lookup|catalog|json|ndjson)' | head -1000 || true
