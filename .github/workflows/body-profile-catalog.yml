name: Probe latest Victory Road character CFG

on:
  push:
    branches: [feature/player-body-profiles-exact]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-character-cfg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe VFS and latest CFG
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          bases = [
              "https://cdn.rosegriffon.fr",
              "https://cdn.aphrody.com",
              "https://nie.aphrody.com/assets",
          ]
          directory = "data/common/gamedata/character/"
          probes = {}
          saved = {}

          def fetch(url, timeout=45):
              req=urllib.request.Request(url,headers={"User-Agent":"inazuma-body-profile-catalog/1.0"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status, r.headers.get("content-type",""), r.read()

          for base in bases:
              q=urllib.parse.urlencode({"path":directory,"limit":500})
              url=f"{base}/vfs/ls?{q}" if not base.endswith("/assets") else f"{base}/vfs/ls?{q}"
              try:
                  st,ct,raw=fetch(url)
                  probes[url]={"status":st,"contentType":ct,"bytes":len(raw),"sample":raw[:500].decode("utf-8","replace")}
                  if st==200:
                      try:
                          saved[f"list::{base}"]=json.loads(raw)
                      except Exception:
                          pass
              except Exception as e:
                  probes[url]={"error":f"{type(e).__name__}: {e}"}

          versions=["1.03.75.00","1.03.74.00","1.03.73.00","1.03.72.00","1.03.71.00","1.03.70.00"]
          names=["chara_model","chara_body"]
          for base in bases:
              for version in versions:
                  for name in names:
                      path=f"data/common/gamedata/character/{name}_{version}.cfg.bin"
                      url=f"{base}/cfg/{path}.json" if not base.endswith("/assets") else f"{base}/cfg/{path}.json"
                      try:
                          st,ct,raw=fetch(url)
                          probes[url]={"status":st,"contentType":ct,"bytes":len(raw)}
                          if st==200 and raw.lstrip().startswith((b"{",b"[")):
                              saved[f"{name}_{version}::{base}"]=json.loads(raw)
                              print("FOUND",name,version,base,len(raw))
                      except Exception as e:
                          probes[url]={"error":f"{type(e).__name__}: {e}"}

          Path("data/cfg_probe_report.json").write_text(json.dumps(probes,indent=2,ensure_ascii=False)+"\n")
          Path("data/cfg_probe_payloads.json").write_text(json.dumps(saved,ensure_ascii=False)+"\n")
          print("SAVED_KEYS",json.dumps(list(saved)))
          if not any(k.startswith("chara_model_") for k in saved):
              raise SystemExit(2)
          PY
      - name: Upload CFG probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: victory-road-cfg-probe
          if-no-files-found: error
          path: |
            data/cfg_probe_report.json
            data/cfg_probe_payloads.json
