name: Resolve latest G4 Blender body profiles

on:
  push:
    branches: [feature/player-body-profiles-exact]
    paths: [.github/workflows/body-profile-catalog.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Resolve unresolved codes against latest authoritative lookup
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/chara_model_lookup.json \
            https://raw.githubusercontent.com/The-RealBobi/G4_Blender/main/chara_model_lookup.json
          python - <<'PY'
          import ast, json, re, urllib.request
          from pathlib import Path

          old_url = "https://raw.githubusercontent.com/ferro0403/inazuma-eleven-/85d116e6dfcaa2995b596e212a2ce3b7a1f1b11f/.github/workflows/body-profile-catalog.yml"
          with urllib.request.urlopen(old_url, timeout=60) as r:
              old = r.read().decode("utf-8")
          m = re.search(r"^\s*codes\s*=\s*(\[[^\n]+\])", old, re.M)
          codes = ast.literal_eval(m.group(1))
          assert len(codes) == 87

          lookup = json.loads(Path("/tmp/chara_model_lookup.json").read_text(encoding="utf-8"))
          models = lookup["models"]
          bodies = lookup["bodies"]
          print("COUNTS models=", len(models), "bodies=", len(bodies))
          print("MODEL_SAMPLE", json.dumps(list(models.items())[:3], ensure_ascii=False))
          print("BODY_SAMPLE", json.dumps(list(bodies.items())[:3], ensure_ascii=False))

          def contains_code(value, code):
              if isinstance(value, str):
                  return code.casefold() in value.casefold()
              if isinstance(value, dict):
                  return any(contains_code(k, code) or contains_code(v, code) for k, v in value.items())
              if isinstance(value, list):
                  return any(contains_code(v, code) for v in value)
              return False

          results={}
          for code in codes:
              exact=[]
              if code in models:
                  exact.append({"key":code,"value":models[code]})
              # Also locate the code anywhere in an entry; this is exact string linkage, not heuristic.
              nested=[]
              for key, value in models.items():
                  if key == code:
                      continue
                  if contains_code(key, code) or contains_code(value, code):
                      nested.append({"key":key,"value":value})
                      if len(nested) >= 20:
                          break
              results[code]={"exact":exact,"nested":nested}
              if exact or nested:
                  print("MATCH", code, json.dumps(results[code], ensure_ascii=False))

          print("MATCHED_CODES", sum(bool(v["exact"] or v["nested"]) for v in results.values()), "/", len(codes))
          Path("data/latest_g4_body_aliases.json").write_text(
              json.dumps({
                  "version":1,
                  "source":"The-RealBobi/G4_Blender/main/chara_model_lookup.json",
                  "lookupVersion":lookup.get("version"),
                  "modelCount":len(models),
                  "bodyCount":len(bodies),
                  "results":results,
              },ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          PY
      - name: Upload exact latest lookup matches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-g4-body-aliases
          if-no-files-found: error
          path: data/latest_g4_body_aliases.json
