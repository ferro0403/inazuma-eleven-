name: Recover exact body profiles from historical CFG lookups

on:
  push:
    branches: [feature/player-body-profiles-exact]
    paths: [.github/workflows/body-profile-catalog.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Search unresolved internal codes in exact G4 lookup revisions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path

          codes = ["c01000915","c02024210","c02024220","c02024230","c04017360","c04017410","c06037140","c04017470","c03030710","c03031450","c03031470","c11803100","c07020120","c11807250","c07040120","c07050060","c07050070","c07050080","c07050090","c07050100","c07050110","c07050120","c07050020","c07050030","c07050040","c07050010","c11807280","c07070030","c07070040","c07070050","c07070060","c07070070","c07070080","c07070090","c07070100","c07070020","c07070110","c11807230","c07080050","c07080060","c07080070","c07080080","c07080090","c07080100","c07090100","c07090090","c07090070","c07090110","c07090080","c07090050","c07090060","c07090040","c07090120","c07090030","c07090140","c07100040","c07100100","c07100110","c07100090","c07100080","c07100140","c07100120","c11807200","c07110020","c11807270","c11807260","c07120020","c07120010","c07120050","c07120080","c07120070","c07120030","c07120060","c07120090","c08130110","c08130100","c08130090","c08130080","c08130060","c08130050","c08130030","c08130020","c08130010","c08130140","c08130130","c08130120","c11807240"]

          refs = [
              ("current_cfg", "d2e2686256e79cc9fdb008847f272d81ae87bdeb"),
              ("body_variants_fix", "af44bd04e6b26414ba79ae9161cdd43cd599e884"),
              ("initial_import", "c6111234fbe2e33d383ed4e0f1e54b8955a770cb"),
          ]

          records = {c: [] for c in codes}
          for label, ref in refs:
              url = f"https://raw.githubusercontent.com/The-RealBobi/G4_Blender/{ref}/chara_model_lookup.json"
              req = urllib.request.Request(url, headers={"User-Agent":"inazuma-body-profile-catalog/1.0"})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  raw = resp.read()
              data = json.loads(raw)
              models = data.get("models") or {}
              bodies = data.get("bodies") or {}
              print("SNAPSHOT", label, ref, "keys", sorted(data.keys()), "models", len(models), "bodies", len(bodies), "bytes", len(raw))
              for k,v in list(models.items())[:3]:
                  print("MODEL_SAMPLE", label, k, json.dumps(v, separators=(",",":")))

              text = raw.decode("utf-8", errors="replace").lower()
              for code in codes:
                  exact_text = code in text
                  key_hits = [(k,v) for k,v in models.items() if code in str(k).lower()]
                  value_hits = [(k,v) for k,v in models.items() if code in json.dumps(v, separators=(",",":")).lower()]
                  if not (exact_text or key_hits or value_hits):
                      continue
                  hits = []
                  seen = set()
                  for kind, seq in (("key",key_hits),("value",value_hits)):
                      for key,row in seq:
                          ident=(kind,key)
                          if ident in seen: continue
                          seen.add(ident)
                          body_id = row.get("body_id") if isinstance(row,dict) else None
                          body = bodies.get(str(body_id)) if body_id is not None else None
                          hits.append({
                              "snapshot":label,
                              "ref":ref,
                              "match":kind,
                              "modelKey":key,
                              "modelRow":row,
                              "body":body,
                          })
                  records[code].extend(hits)
                  print("CODE_HIT", code, "text", exact_text, "key_hits", len(key_hits), "value_hits", len(value_hits))

          out = {
              "version":2,
              "method":"exact unresolved internalCode occurrence in raw G4 lookup revisions only",
              "requested":len(codes),
              "codesWithModelRows":sum(bool(v) for v in records.values()),
              "unresolved":[c for c,v in records.items() if not v],
              "records":records,
          }
          Path("data/historical_exact_body_profiles.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print("RESULT", json.dumps({
              "requested":out["requested"],
              "codesWithModelRows":out["codesWithModelRows"],
              "unresolved":len(out["unresolved"]),
          },separators=(",",":")))
          for code in ("c07110020","c07050010","c03031470","c01000915"):
              print("EXAMPLE", code, json.dumps(records[code],ensure_ascii=False,separators=(",",":")))
          PY
      - name: Upload historical exact matches
        uses: actions/upload-artifact@v4
        with:
          name: historical-exact-body-profiles
          path: data/historical_exact_body_profiles.json
