name: Probe live NIE model ids for unresolved body profiles

on:
  push:
    branches: [feature/player-body-profiles-exact]
    paths: [.github/workflows/body-profile-catalog.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-model-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query exact unresolved codes from live NIE catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          old_url = "https://raw.githubusercontent.com/ferro0403/inazuma-eleven-/85d116e6dfcaa2995b596e212a2ce3b7a1f1b11f/.github/workflows/body-profile-catalog.yml"
          with urllib.request.urlopen(old_url, timeout=60) as r:
              old = r.read().decode("utf-8")
          m = re.search(r"^\s*codes\s*=\s*(\[[^\n]+\])", old, re.M)
          if not m:
              raise RuntimeError("missing unresolved code list")
          codes = ast.literal_eval(m.group(1))
          if len(codes) != 87:
              raise RuntimeError(f"expected 87 codes, got {len(codes)}")

          records = {}
          for code in codes:
              url = "https://nie.aphrody.com/api/v1/chara?" + urllib.parse.urlencode({
                  "q": code,
                  "per_page": 50,
              })
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "inazuma-body-profile-audit/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.load(r)
                  rows = payload.get("elements") or payload.get("page", {}).get("elements") or []
                  exact = [row for row in rows if (row.get("internal_code") or "").casefold() == code.casefold()]
                  records[code] = exact
              except Exception as exc:
                  records[code] = [{"_error": repr(exc)}]
              time.sleep(0.03)

          resolved = {
              code: rows[0].get("model_id")
              for code, rows in records.items()
              if rows and not rows[0].get("_error") and rows[0].get("model_id")
          }
          errors = {code: rows for code, rows in records.items() if rows and rows[0].get("_error")}
          print("RESULT requested=", len(codes), "model_ids=", len(resolved), "errors=", len(errors))
          for code in codes:
              rows = records[code]
              if not rows:
                  print(code, "NO_ROW")
              elif rows[0].get("_error"):
                  print(code, "ERROR", rows[0]["_error"])
              else:
                  row = rows[0]
                  print(code, "model_id=", row.get("model_id"), "chara_id=", row.get("chara_id"), "zukan_order=", row.get("zukan_order"))

          out = {
              "version": 1,
              "source": "https://nie.aphrody.com/api/v1/chara",
              "requested": len(codes),
              "resolvedModelIds": len(resolved),
              "records": records,
          }
          Path("data/nie_live_model_ids_for_body_profiles.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload live exact model ids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nie-live-model-ids
          if-no-files-found: error
          path: data/nie_live_model_ids_for_body_profiles.json
