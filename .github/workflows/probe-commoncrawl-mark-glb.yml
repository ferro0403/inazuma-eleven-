name: Probe Common Crawl Mark GLB

on:
  push:
    branches:
      - feature/player-body-profiles-exact
    paths:
      - .github/workflows/probe-commoncrawl-mark-glb.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search Common Crawl indexes and recover payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p commoncrawl
          python - <<'PY'
          import gzip
          import hashlib
          import io
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          targets = [
              "cdn.rosegriffon.fr/model-full/c01000010.glb",
              "cdn.aphrody.com/model-full/c01000010.glb",
              "cdn.rosegriffon.fr/dx11/chr/_face/01_IE1/c01000010/c01000010.png",
              "cdn.rosegriffon.fr/dx11/chr/_uniform/u000101/u010101_10.png",
          ]
          ua={"User-Agent":"Mozilla/5.0 (compatible; inazuma-research/1.0)"}

          with urllib.request.urlopen(
              urllib.request.Request("https://index.commoncrawl.org/collinfo.json", headers=ua),
              timeout=30,
          ) as resp:
              collections=json.load(resp)

          # Search newest first, but include enough history to cover the time these services existed.
          indexes=[c["id"] for c in collections[:30]]
          report={"indexes":indexes,"targets":[]}
          saved=False

          def query(index,target):
              url=f"https://index.commoncrawl.org/{index}-index?"+urllib.parse.urlencode({
                  "url":target,
                  "output":"json",
                  "filter":"status:200",
              })
              req=urllib.request.Request(url,headers=ua)
              try:
                  with urllib.request.urlopen(req,timeout=35) as resp:
                      raw=resp.read().decode("utf-8","replace")
                  return [json.loads(line) for line in raw.splitlines() if line.strip()], None
              except Exception as exc:
                  return [], repr(exc)

          def fetch_warc(rec):
              filename=rec.get("filename")
              offset=int(rec.get("offset","0"))
              length=int(rec.get("length","0"))
              if not filename or length<=0:
                  return None, "missing WARC location"
              url="https://data.commoncrawl.org/"+filename
              req=urllib.request.Request(url,headers={**ua,"Range":f"bytes={offset}-{offset+length-1}"})
              try:
                  with urllib.request.urlopen(req,timeout=60) as resp:
                      chunk=resp.read()
                  # Range is a gzip member containing WARC record.
                  try:
                      warc=gzip.GzipFile(fileobj=io.BytesIO(chunk)).read()
                  except Exception:
                      warc=chunk
                  # Strip WARC headers, then HTTP headers.
                  split=warc.find(b"\r\n\r\n")
                  payload=warc[split+4:] if split>=0 else warc
                  if payload.startswith(b"HTTP/"):
                      split2=payload.find(b"\r\n\r\n")
                      payload=payload[split2+4:] if split2>=0 else payload
                  return payload, None
              except Exception as exc:
                  return None, repr(exc)

          for target in targets:
              item={"target":target,"matches":[]}
              for index in indexes:
                  rows,error=query(index,target)
                  if error:
                      item.setdefault("index_errors",[]).append({"index":index,"error":error})
                      continue
                  if not rows:
                      continue
                  item["matches"].extend({"index":index,**row} for row in rows[:20])
                  # Try every matching 200 capture in this index.
                  for row in rows[:20]:
                      payload,error2=fetch_warc(row)
                      probe={"index":index,"timestamp":row.get("timestamp"),"url":row.get("url")}
                      if error2:
                          probe["error"]=error2
                      else:
                          probe.update({
                              "bytes":len(payload),
                              "headHex":payload[:16].hex(),
                              "sha256":hashlib.sha256(payload).hexdigest(),
                              "mime":row.get("mime"),
                          })
                          if payload[:4]==b"glTF":
                              pathlib.Path("commoncrawl/c01000010.glb").write_bytes(payload)
                              probe["saved"]="c01000010.glb"
                              saved=True
                          elif payload.startswith(b"\x89PNG\r\n\x1a\n"):
                              out="commoncrawl/"+("mark-face" if "face" in target else "raimon")+".png"
                              pathlib.Path(out).write_bytes(payload)
                              probe["saved"]=out
                      item.setdefault("probes",[]).append(probe)
                  if saved and "model-full" in target:
                      break
              report["targets"].append(item)

          pathlib.Path("commoncrawl/report.json").write_text(json.dumps(report,indent=2))
          lines=[]
          for item in report["targets"]:
              lines.append(f"TARGET {item['target']} matches={len(item['matches'])}")
              for p in item.get("probes",[])[:30]:
                  lines.append("  "+json.dumps(p,ensure_ascii=False))
          lines.append(f"saved_glb={saved}")
          pathlib.Path("commoncrawl/summary.txt").write_text("\n".join(lines)+"\n")
          print(pathlib.Path("commoncrawl/summary.txt").read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commoncrawl-mark-glb-probe
          path: commoncrawl/
          if-no-files-found: error
