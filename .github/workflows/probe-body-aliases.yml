name: Probe Victory Road body aliases

on:
  push:
    branches:
      - feature/player-body-profiles-exact
    paths:
      - .github/workflows/probe-body-aliases.yml

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download exact mapping artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/body-map
          gh run download 35357488462 -n victory-road-player-body-profiles -D /tmp/body-map

      - name: Test shared visual asset as exact alias key
        run: |
          python - <<'PY'
          import json, re
          from collections import defaultdict, Counter
          from pathlib import Path

          text=Path("data/players.js").read_text(encoding="utf-8")
          m=re.search(r"globalThis\.INAZUMA_PLAYERS\s*=\s*(\[[\s\S]*\]);\s*$",text)
          players=json.loads(m.group(1))
          mapping=json.loads(Path("/tmp/body-map/player_body_profiles.json").read_text())
          report=json.loads(Path("/tmp/body-map/player_body_profiles_report.json").read_text())

          by_id={int(p["id"]):p for p in players}
          groups=defaultdict(list)
          for p in players:
              url=(p.get("imageUrl") or p.get("portraitUrl") or "").strip()
              if url:
                  # Exact URL identity only: no name/gender/height inference.
                  groups[url].append(int(p["id"]))

          contradictions=[]
          resolved_missing=[]
          unresolved=[]
          for miss in report["unresolved"]:
              pid=int(miss["playerId"])
              p=by_id[pid]
              url=(p.get("imageUrl") or p.get("portraitUrl") or "").strip()
              peers=groups.get(url,[])
              known=[]
              for qid in peers:
                  rec=mapping.get(str(qid),{})
                  t=rec.get("bodyTypeIdx")
                  if t is not None:
                      known.append((qid,t,rec.get("internalCode"),by_id[qid].get("name")))
              types=sorted({x[1] for x in known})
              if len(types)==1:
                  resolved_missing.append({
                    "playerId":pid,"name":p.get("name"),"internalCode":miss["internalCode"],
                    "bodyTypeIdx":types[0],"peerCount":len(known),"peers":known[:8],
                    "asset":url,
                  })
              else:
                  unresolved.append({
                    "playerId":pid,"name":p.get("name"),"internalCode":miss["internalCode"],
                    "knownPeerTypes":types,"knownPeers":known[:8],"peerIds":peers,
                    "asset":url,
                  })

          # Audit the proposed key across ALL groups: any one shared asset mapping to >1 body type invalidates it.
          for url,ids in groups.items():
              typed=[]
              for pid in ids:
                  rec=mapping.get(str(pid),{})
                  t=rec.get("bodyTypeIdx")
                  if t is not None:
                      typed.append((pid,t,rec.get("internalCode"),by_id[pid].get("name")))
              types=sorted({x[1] for x in typed})
              if len(types)>1:
                  contradictions.append({"asset":url,"types":types,"rows":typed})

          print("TOTAL_GROUPS",len(groups))
          print("CONTRADICTORY_GROUPS",len(contradictions))
          print("MISSING_RESOLVED_BY_EXACT_ASSET",len(resolved_missing))
          print("MISSING_STILL_UNRESOLVED",len(unresolved))
          print("TYPE_COUNTS",dict(Counter(x["bodyTypeIdx"] for x in resolved_missing)))
          print("RESOLVED")
          print(json.dumps(resolved_missing,ensure_ascii=False,indent=2))
          print("UNRESOLVED")
          print(json.dumps(unresolved,ensure_ascii=False,indent=2))
          if contradictions:
              print("CONTRADICTIONS")
              print(json.dumps(contradictions[:20],ensure_ascii=False,indent=2))
          PY
