name: Probe Victory Road body aliases

on:
  push:
    branches:
      - feature/player-body-profiles-exact
    paths:
      - .github/workflows/probe-body-aliases.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Azalee raw character payload
        shell: bash
        run: |
          set -u
          url="https://azalee.rosegriffon.fr/chara/mark-evans-0x3055CF22"
          curl -L --connect-timeout 10 --max-time 45 -sS "$url" -o /tmp/mark.html || true
          echo "html_bytes=$(wc -c < /tmp/mark.html 2>/dev/null || echo 0)"
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path("/tmp/mark.html").read_text(errors="replace")
          needles=["c01000010","c07110020","internal_code","model_id","modelId","body_id","bodyType","__next_f"]
          for n in needles:
              print("NEEDLE",n,"count",text.count(n))
              for m in list(re.finditer(re.escape(n), text, re.I))[:8]:
                  print(text[max(0,m.start()-350):m.end()+700].replace("\n"," ")[:1200])
          PY

          for base in "https://azalee.rosegriffon.fr" "https://api.rosegriffon.fr" "https://api.aphrody.com"; do
            for code in c01000010 c07110020 c07050010 c03031470 c08130010; do
              echo "=== $base API $code ==="
              curl -L --connect-timeout 10 --max-time 30 -sS -w "\nHTTP=%{http_code}\n" \
                "$base/api/v1/chara?q=$code&per_page=10" | head -c 5000 || true
              echo
            done
          done
