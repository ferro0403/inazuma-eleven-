name: Probe Victory Road body aliases

on:
  push:
    branches:
      - feature/player-body-profiles-exact
    paths:
      - .github/workflows/probe-body-aliases.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install image classifier deps
        run: pip install pillow numpy scikit-learn requests
      - name: Audit body profile from official Zukan model renders
        run: |
          python - <<'PY'
          import io, json, random, time
          from collections import Counter, defaultdict
          from pathlib import Path
          import numpy as np
          import requests
          from PIL import Image
          from sklearn.ensemble import RandomForestClassifier, ExtraTreesClassifier
          from sklearn.metrics import accuracy_score, confusion_matrix
          from sklearn.model_selection import train_test_split
          from sklearn.neighbors import KNeighborsClassifier
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler

          catalog=json.loads(Path("data/victory_road_body_profiles.json").read_text())
          models=requests.get(
              "https://raw.githubusercontent.com/salty-max/kizuna/05c979efe9ef4565468d725db67c0913394f63dd/data/raw/character-models.json",
              timeout=30,
          ).json()

          targets=[
              "c04017360","c04017410","c06037140","c04017470","c11803100",
              "c07100100","c07100110","c07100090","c07100080","c07100140",
              "c07100120","c11807270",
          ]
          # Common human classes are enough for these unresolved football characters.
          # Include every profile with at least 5 source characters in the exact catalog.
          by_type=defaultdict(list)
          for code, body_id in catalog["characters"].items():
              body=catalog["bodies"].get(str(body_id))
              if not body or code not in models:
                  continue
              t=body.get("bodyProfile")
              if isinstance(t,int) and 0 <= t <= 17:
                  by_type[t].append(code)

          random.seed(1337)
          selected=[]
          for t,codes in sorted(by_type.items()):
              random.shuffle(codes)
              # More examples for common classes; retain every rare class.
              selected += [(c,t) for c in codes[:min(45,len(codes))]]

          cache=Path("/tmp/zukan-renders"); cache.mkdir(parents=True,exist_ok=True)
          sess=requests.Session()
          sess.headers["User-Agent"]="Mozilla/5.0 body-profile-audit/1.0"
          failed=[]

          def fetch(code):
              p=cache/(code+".webp")
              if p.exists(): return p.read_bytes()
              stem=models.get(code)
              if not stem: return None
              url=f"https://dxi4wb638ujep.cloudfront.net/{stem}_r0_fullbody.webp"
              try:
                  r=sess.get(url,timeout=20)
                  if r.ok and len(r.content)>500:
                      p.write_bytes(r.content); return r.content
                  failed.append((code,r.status_code,len(r.content),url))
              except Exception as e:
                  failed.append((code,type(e).__name__,str(e),url))
              return None

          def features(raw):
              im=Image.open(io.BytesIO(raw)).convert("RGBA")
              a=np.asarray(im.getchannel("A"),dtype=np.uint8)
              mask=a>16
              ys,xs=np.where(mask)
              if not len(xs): return None
              y0,y1,x0,x1=ys.min(),ys.max(),xs.min(),xs.max()
              crop=mask[y0:y1+1,x0:x1+1]
              h,w=crop.shape
              # Remove head/hair-heavy top 32%, keep torso/hips/legs.
              cut=int(round(h*0.32))
              lower=crop[cut:,:]
              # Center each row by its occupied span, extracting scale-free widths.
              rows=[]
              lefts=[]; rights=[]
              for frac in np.linspace(0.0,0.99,96):
                  y=min(lower.shape[0]-1,int(frac*lower.shape[0]))
                  xx=np.flatnonzero(lower[y])
                  if len(xx):
                      rows.append((xx[-1]-xx[0]+1)/w)
                      lefts.append(xx[0]/w); rights.append(xx[-1]/w)
                  else:
                      rows.append(0.0); lefts.append(0.5); rights.append(0.5)
              # Occupancy on a coarse 12x20 grid after nearest-neighbour normalization.
              norm=np.asarray(Image.fromarray((lower*255).astype(np.uint8)).resize((20,36),Image.Resampling.NEAREST))>0
              # Use only lower 30 rows to reduce shoulders/arms influence.
              grid=norm[6:,:].astype(np.float32).ravel()
              f=np.array(
                  [w/h, h/im.height, w/im.width, mask.mean(), lower.mean()]
                  + rows + lefts + rights + grid.tolist(),
                  dtype=np.float32
              )
              return f

          from concurrent.futures import ThreadPoolExecutor
          with ThreadPoolExecutor(max_workers=24) as pool:
              raws=list(pool.map(lambda ct: fetch(ct[0]), selected))
          X=[]; y=[]; codes_ok=[]
          for (code,t),raw in zip(selected,raws):
              if raw is None: continue
              f=features(raw)
              if f is not None:
                  X.append(f); y.append(t); codes_ok.append(code)
          print("DOWNLOADED",len(selected),"usable",len(X),"failed",len(failed))

          X=np.asarray(X); y=np.asarray(y)
          counts=Counter(y.tolist())
          print("TRAIN_ROWS",len(y))
          print("TRAIN_TYPE_COUNTS",dict(sorted(counts.items())))
          print("DOWNLOAD_FAILURES",len(failed),failed[:10])

          eligible={t for t,n in counts.items() if n>=4}
          mask=np.array([t in eligible for t in y])
          X2,y2=X[mask],y[mask]
          tr,te=train_test_split(
              np.arange(len(y2)),test_size=0.28,random_state=20260918,stratify=y2
          )

          models_ml={
              "knn":make_pipeline(StandardScaler(),KNeighborsClassifier(n_neighbors=5,weights="distance")),
              "rf":RandomForestClassifier(n_estimators=500,random_state=42,class_weight="balanced_subsample",n_jobs=-1,max_features="sqrt"),
              "extra":ExtraTreesClassifier(n_estimators=600,random_state=43,class_weight="balanced",n_jobs=-1,max_features="sqrt"),
          }
          for name,clf in models_ml.items():
              clf.fit(X2[tr],y2[tr])
              pred=clf.predict(X2[te])
              print("MODEL",name,"ACCURACY",round(float(accuracy_score(y2[te],pred)),6))
              per={}
              for t in sorted(eligible):
                  idx=np.flatnonzero(y2[te]==t)
                  if len(idx):
                      per[t]=[int((pred[idx]==t).sum()),int(len(idx)),round(float((pred[idx]==t).mean()),4)]
              print("PER_TYPE",name,json.dumps(per,sort_keys=True))

          # Consensus predictions for targets. Fit on all exact rows.
          target_feats={}
          for code in targets:
              raw=fetch(code)
              target_feats[code]=features(raw) if raw else None

          for name,clf in models_ml.items():
              clf.fit(X2,y2)
              print("TARGET_MODEL",name)
              for code in targets:
                  f=target_feats[code]
                  if f is None:
                      print(code,"NO_IMAGE"); continue
                  pred=int(clf.predict([f])[0])
                  confidence=None
                  if hasattr(clf,"predict_proba"):
                      probs=clf.predict_proba([f])[0]
                      order=np.argsort(probs)[::-1][:3]
                      confidence=[(int(clf.classes_[i]),round(float(probs[i]),4)) for i in order]
                  print(code,"=>",pred,"top",confidence)

          # Also report nearest exact render neighbours to make each decision auditable.
          scaler=StandardScaler().fit(X2)
          ZX=scaler.transform(X2)
          print("TARGET_NEIGHBOURS")
          for code in targets:
              f=target_feats[code]
              if f is None: continue
              z=scaler.transform([f])[0]
              d=np.sqrt(((ZX-z)**2).mean(axis=1))
              idx=np.argsort(d)[:12]
              rows=[(codes_ok[np.flatnonzero(mask)[i]],int(y2[i]),round(float(d[i]),4)) for i in idx]
              print(code,json.dumps(rows))
          PY
