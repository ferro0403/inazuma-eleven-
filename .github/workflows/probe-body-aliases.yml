name: Probe Victory Road body aliases

on:
  push:
    branches:
      - feature/player-body-profiles-exact
    paths:
      - .github/workflows/probe-body-aliases.yml

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact mapping artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/body-map
          gh run download 35357488462 -n victory-road-player-body-profiles -D /tmp/body-map
      - name: Audit exact-name character aliases
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from collections import defaultdict, Counter
          from pathlib import Path

          text=Path("data/players.js").read_text(encoding="utf-8")
          players=json.loads(re.search(r"globalThis\.INAZUMA_PLAYERS\s*=\s*(\[[\s\S]*\]);\s*$",text).group(1))
          mapping=json.loads(Path("/tmp/body-map/player_body_profiles.json").read_text())
          report=json.loads(Path("/tmp/body-map/player_body_profiles_report.json").read_text())
          by_id={int(p["id"]):p for p in players}

          def key(name):
              return unicodedata.normalize("NFKC", str(name or "")).strip().casefold()

          groups=defaultdict(list)
          for p in players:
              groups[key(p.get("name"))].append(int(p["id"]))

          contradictions=[]
          for name,ids in groups.items():
              typed=[]
              for pid in ids:
                  rec=mapping.get(str(pid),{})
                  if rec.get("bodyTypeIdx") is not None:
                      typed.append((pid,rec["bodyTypeIdx"],rec.get("internalCode"),by_id[pid].get("name"),by_id[pid].get("game")))
              types=sorted({x[1] for x in typed})
              if len(types)>1:
                  contradictions.append({"name":name,"types":types,"rows":typed})

          resolved=[]
          unresolved=[]
          for miss in report["unresolved"]:
              pid=int(miss["playerId"]); p=by_id[pid]
              peers=[]
              for qid in groups[key(p.get("name"))]:
                  rec=mapping.get(str(qid),{})
                  if rec.get("bodyTypeIdx") is not None:
                      peers.append((qid,rec["bodyTypeIdx"],rec.get("internalCode"),by_id[qid].get("game")))
              types=sorted({x[1] for x in peers})
              row={"playerId":pid,"name":p.get("name"),"internalCode":miss["internalCode"],"game":p.get("game"),"types":types,"peers":peers}
              (resolved if len(types)==1 else unresolved).append(row)

          print("NAME_GROUPS",len(groups))
          print("CONTRADICTORY_NAME_GROUPS",len(contradictions))
          print("MISSING_WITH_UNANIMOUS_KNOWN_NAME_PROFILE",len(resolved))
          print("MISSING_STILL_UNRESOLVED",len(unresolved))
          print("TYPE_COUNTS",dict(Counter(r["types"][0] for r in resolved)))
          print("RESOLVED")
          print(json.dumps(resolved,ensure_ascii=False,indent=2))
          print("UNRESOLVED")
          print(json.dumps(unresolved,ensure_ascii=False,indent=2))
          print("CONTRADICTIONS_SAMPLE")
          print(json.dumps(contradictions[:30],ensure_ascii=False,indent=2))
          PY
