name: Probe Victory Road body aliases

on:
  push:
    branches:
      - feature/player-body-profiles-exact
    paths:
      - .github/workflows/probe-body-aliases.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pillow numpy requests
      - name: Compare IE3 manager body family
        run: |
          python - <<'PY'
          import io,json
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import numpy as np,requests
          from PIL import Image

          cat=json.loads(Path("data/victory_road_body_profiles.json").read_text())
          models=requests.get("https://raw.githubusercontent.com/salty-max/kizuna/05c979efe9ef4565468d725db67c0913394f63dd/data/raw/character-models.json",timeout=30).json()
          codes=[f"c11803{i:02d}0" for i in range(1,11)]
          # Correct explicit sequence 010..100.
          codes=["c11803010","c11803020","c11803030","c11803040","c11803050","c11803060","c11803070","c11803080","c11803090","c11803100"]
          frames=range(8)

          def t(code):
            bid=cat["characters"].get(code)
            return None if bid is None else cat["bodies"][str(bid)]["bodyProfile"]

          def dl(k):
            code,fr=k
            u=f"https://dxi4wb638ujep.cloudfront.net/{models[code]}_r{fr}_fullbody.webp"
            r=requests.get(u,timeout=20)
            return k,r.content

          keys=[(c,f) for c in codes for f in frames]
          with ThreadPoolExecutor(max_workers=32) as ex:
            raw=dict(ex.map(dl,keys))

          def feat(data):
            im=Image.open(io.BytesIO(data)).convert("RGBA")
            a=np.asarray(im.getchannel("A")); m=a>16
            ys,xs=np.where(m); y0,y1,x0,x1=ys.min(),ys.max(),xs.min(),xs.max()
            crop=m[y0:y1+1,x0:x1+1]; h,w=crop.shape
            out=[w/h,h/im.height,w/im.width]
            for start in (.18,.28,.38,.48):
                q=crop[int(h*start):]
                for frac in np.linspace(0,.99,96):
                    yy=min(q.shape[0]-1,int(frac*q.shape[0])); xx=np.flatnonzero(q[yy])
                    out += [0 if not len(xx) else (xx[-1]-xx[0]+1)/w]
            return np.array(out,dtype=float)

          F={c:np.concatenate([feat(raw[(c,f)]) for f in frames]) for c in codes}
          # Standardize dimensions across this homogeneous family.
          M=np.stack(list(F.values())); mean=M.mean(0); std=M.std(0); std[std<1e-6]=1
          Z={c:(v-mean)/std for c,v in F.items()}
          target="c11803100"
          rows=[]
          for c in codes[:-1]:
              d=float(np.sqrt(np.mean((Z[target]-Z[c])**2)))
              rows.append((c,t(c),round(d,6)))
          rows.sort(key=lambda x:x[2])
          print("MANAGER_NEIGHBOURS",json.dumps(rows))
          # Per-view raw feature distances so one camera cannot dominate.
          for fr in frames:
              tf=feat(raw[(target,fr)])
              rr=[]
              for c in codes[:-1]:
                  cf=feat(raw[(c,fr)])
                  rr.append((c,t(c),round(float(np.sqrt(np.mean((tf-cf)**2))),6)))
              rr.sort(key=lambda x:x[2])
              print("VIEW",fr,json.dumps(rr))
          PY
