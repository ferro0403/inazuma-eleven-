name: scratch raw HTTP Zukan probe
on:
  push:
    branches: [tmp/zukan-attributes-only-20261118]
    paths: [scripts/probe_stats_http.py, .github/workflows/probe-stats-http.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/probe_stats_http.py
