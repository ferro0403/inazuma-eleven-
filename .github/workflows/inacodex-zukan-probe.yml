name: InaCodex Zukan browser probe
on:
  push:
    branches:
      - feat/inacodex-zukan-import-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
      - name: Read-only test of official Zukan
        run: python scripts/probe_zukan_browser.py
