name: Probe raw Mark Victory Road assets

on:
  push:
    branches:
      - feature/player-body-profiles-exact
    paths:
      - .github/workflows/probe-raw-mark-assets.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate bundle inspector tests
        run: python -m unittest tests/test_inspect_vr_asset_bundle.py -v

      - name: Probe public raw/model endpoints without publishing game bytes
        shell: python
        run: |
          import hashlib
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          paths = [
              "data/common/chr/_face/01_IE1/c01000010/c01000010.g4md",
              "data/common/chr/_face/01_IE1/c01000010/c01000010.g4mg",
              "data/dx11/chr/_face/01_IE1/c01000010/c01000010.g4tx",
              "data/common/chr/c000101/c000101.g4sk",
              "data/common/chr/_uniform/u000101/u000101.g4md",
              "data/common/chr/_uniform/u000101/u000101.g4mg",
              "data/dx11/chr/_uniform/u000101/u010101_10.g4tx",
          ]
          urls = [
              "https://cdn.rosegriffon.fr/health",
              "https://cdn.rosegriffon.fr/model-full/c01000010.glb",
              "https://cdn.aphrody.com/health",
              "https://cdn.aphrody.com/model-full/c01000010.glb",
              "https://aphrody.com/model-full/c01000010.glb",
              "https://azalee.rosegriffon.fr/assets/model-full/c01000010.glb",
          ]
          for path in paths:
              urls.extend([
                  f"https://cdn.rosegriffon.fr/f/{path}",
                  f"https://cdn.rosegriffon.fr/raw/{path}",
              ])

          report = []
          for url in urls:
              row = {"url": url}
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "inazuma-dataset-asset-probe/1.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      data = response.read()
                      row.update({
                          "status": response.status,
                          "contentType": response.headers.get("Content-Type"),
                          "contentLengthHeader": response.headers.get("Content-Length"),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "headHex": data[:16].hex(),
                      })
              except urllib.error.HTTPError as exc:
                  body = exc.read(4096)
                  row.update({
                      "status": exc.code,
                      "contentType": exc.headers.get("Content-Type"),
                      "bytes": len(body),
                      "headHex": body[:16].hex(),
                      "error": str(exc),
                  })
              except Exception as exc:
                  row.update({"status": None, "error": repr(exc)})
              report.append(row)
              print(json.dumps(row, ensure_ascii=False))

          Path("raw-mark-asset-probe.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Upload probe report only
        uses: actions/upload-artifact@v4
        with:
          name: raw-mark-asset-probe
          path: raw-mark-asset-probe.json
          if-no-files-found: error
